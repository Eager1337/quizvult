name: QuizVault CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Type-check application
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Type-check build configuration
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Run lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
